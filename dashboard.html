<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ===========================
            Basic Meta
    ============================ -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard | JobSetu Telugu</title>

    <!-- Logo -->

    <link rel="icon"
          href="images/logo.png">

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
          href="css/dashboard.css">

</head>

<body>

    <!-- ======================================
                Dashboard Container
    ======================================= -->

    <div class="dashboard">

        <!-- ===========================
        Sidebar
=========================== -->

<aside class="sidebar">

    <!-- Logo -->

    <div class="sidebar-logo">

        <img src="images/logo.png"
             alt="JobSetu Telugu">

        <h2>
            <span class="job">Job</span><span class="setu">Setu</span>
            <span class="telugu">తెలుగు</span>
        </h2>

    </div>

    <!-- Navigation -->

    <nav>

        <ul>

            <li class="active">
                <i class="fa-solid fa-house"></i>
                <span>Dashboard</span>
            </li>

            <li>
                <i class="fa-solid fa-map-location-dot"></i>
                <span>Telangana Jobs</span>
            </li>

            <li>
                <i class="fa-solid fa-map"></i>
                <span>Andhra Pradesh Jobs</span>
            </li>

            <li>
                <i class="fa-solid fa-landmark"></i>
                <span>Central Jobs</span>
            </li>

            <li>
                <i class="fa-solid fa-file-pen"></i>
                <span>Mock Tests</span>
            </li>

            <li>
                <i class="fa-solid fa-file-lines"></i>
                <span>Previous Year Papers</span>
            </li>

            <li>
                <i class="fa-solid fa-book"></i>
                <span>Syllabus</span>
            </li>

            <li>
                <i class="fa-solid fa-newspaper"></i>
                <span>Current Affairs</span>
            </li>

            <li>
                <i class="fa-solid fa-robot"></i>
                <span>AI Preparation</span>
            </li>

            <li>
                <i class="fa-solid fa-chart-line"></i>
                <span>My Performance</span>
            </li>

            <li>
                <i class="fa-solid fa-bookmark"></i>
                <span>Bookmarks</span>
            </li>

            <li>
                <i class="fa-solid fa-trophy"></i>
                <span>Leaderboard</span>
            </li>

            <li>
                <i class="fa-solid fa-user"></i>
                <span>Profile</span>
            </li>

        </ul>

    </nav>

    <!-- Logout -->

    <div class="logout">

        <button>

            <i class="fa-solid fa-right-from-bracket"></i>

            Logout

        </button>

    </div>

</aside>

        <!-- Main Content -->

        <main class="main-content">

            <!-- Header -->

            <header class="header">

            </header>

            <!-- Hero Banner -->

            <section class="hero">

            </section>

        </main>

    </div>

    <script src="js/dashboard.js"></script>

</body>

</html>
