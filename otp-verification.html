<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OTP Verification | JobSetu Telugu</title>

<link rel="icon" href="images/logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="css/otp-verification.css">

</head>

<body>

<div class="container">

    <div class="otp-card">

        <img src="images/logo.png" class="logo">

        <h2>OTP Verification</h2>

        <p>
            Enter the 6-digit verification code sent to your registered email.
        </p>

        <div class="otp-box">

            <input type="text" maxlength="1" class="otp">
            <input type="text" maxlength="1" class="otp">
            <input type="text" maxlength="1" class="otp">
            <input type="text" maxlength="1" class="otp">
            <input type="text" maxlength="1" class="otp">
            <input type="text" maxlength="1" class="otp">

        </div>

        <div class="timer">

            OTP expires in
            <span id="countdown">60</span>s

        </div>

        <button id="verifyBtn">

            <i class="fa-solid fa-shield-halved"></i>

            Verify OTP

        </button>

        <button id="resendBtn" class="resend">

            Resend OTP

        </button>

        <a href="forgot-password.html" class="back">

            <i class="fa-solid fa-arrow-left"></i>

            Back

        </a>

    </div>

</div>

<script src="js/otp-verification.js"></script>

</body>
</html>
