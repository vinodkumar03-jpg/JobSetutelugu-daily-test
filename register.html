<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | JobSetu తెలుగు</title>

    <link rel="icon" href="images/logo.png">

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
          href="css/register.css">

</head>

<body>

<div class="background">

    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>

</div>

<div class="container">

    <div class="register-card">

        <img src="images/logo.png"
             class="logo"
             alt="JobSetu Logo">

        <h1 class="title">

            <span class="job">Job</span><span class="setu">Setu</span>

            <span class="telugu">తెలుగు</span>

        </h1>

        <h2>Create Your Account</h2>

        <p class="subtitle">

            Create your free account and start preparing today.

        </p>

        <!-- Full Name -->

        <div class="input-box">

            <i class="fa-solid fa-user"></i>

            <input type="text"
                   id="fullname"
                   placeholder="Full Name">

        </div>

        <!-- Username -->

        <div class="input-box">

            <i class="fa-solid fa-id-card"></i>

            <input type="text"
                   id="username"
                   placeholder="Username">

        </div>

        <!-- Email -->

        <div class="input-box">

            <i class="fa-solid fa-envelope"></i>

            <input type="email"
                   id="email"
                   placeholder="Email Address">

        </div>

        <!-- Mobile -->

        <div class="input-box">

            <i class="fa-solid fa-phone"></i>

            <input type="tel"
                   id="mobile"
                   placeholder="Mobile Number">

        </div>

        <!-- Password -->

        <div class="input-box">

            <i class="fa-solid fa-lock"></i>

            <input type="password"
                   id="password"
                   placeholder="Password">

            <i class="fa-solid fa-eye togglePassword"></i>

        </div>

        <!-- Confirm Password -->

        <div class="input-box">

            <i class="fa-solid fa-lock"></i>

            <input type="password"
                   id="confirmPassword"
                   placeholder="Confirm Password">

            <i class="fa-solid fa-eye toggleConfirm"></i>

        </div>

        <div class="terms">

            <label>

                <input type="checkbox"
                       id="terms">

                I agree to the

                <a href="#">Terms & Conditions</a>

            </label>

        </div>

        <button id="registerBtn">

            <i class="fa-solid fa-user-plus"></i>

            Create Account

        </button>

        <div class="login-link">

            Already have an account?

            <a href="index.html">

                Login

            </a>

        </div>

    </div>

</div>

<script src="js/register.js"></script>

</body>

</html>
