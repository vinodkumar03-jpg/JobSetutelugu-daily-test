<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JobSetu తెలుగు</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/index.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="login-container">

        <!-- Left Section -->
        <div class="left-panel">

            <img src="images/logo.png" alt="JobSetu Telugu Logo" class="logo">

            <h1>JobSetu తెలుగు</h1>

            <p>
                Your Gateway to Government Jobs & Competitive Exam Success
            </p>

        </div>

        <!-- Right Section -->
        <div class="right-panel">

            <div class="login-card">

                <h2>Welcome Back</h2>

                <p>Please login to continue</p>

                <!-- Username -->
                <div class="input-box">
                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        id="username"
                        placeholder="Username or Email">
                </div>

                <!-- Password -->
                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password">

                    <span id="togglePassword">
                        <i class="fa-solid fa-eye"></i>
                    </span>

                </div>

                <!-- Remember -->
                <div class="options">

                    <label>

                        <input type="checkbox">

                        Remember Me

                    </label>

                    <a href="#">Forgot Password?</a>

                </div>

                <!-- Login -->
                <button id="loginBtn">

                    Login

                </button>

                <!-- Divider -->
                <div class="divider">

                    <span>OR</span>

                </div>

                <!-- Register -->
                <button id="registerBtn" class="secondary-btn">

                    Create New Account

                </button>

            </div>

        </div>

    </div>

    <script src="js/index.js"></script>

</body>
</html>
